<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskEarn - Earn Rewards</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="topbar">
    <div class="nav">

      <button class="brand" onclick="showHome()">
        💰 TaskEarn
      </button>

      <div id="navArea" class="navButtons">
        <button class="btn btn-outline" onclick="showAuth('login')">
          Login
        </button>

        <button class="btn btn-primary" onclick="showAuth('register')">
          Create Account
        </button>
      </div>

    </div>
  </header>


  <main>

    <!-- HOME -->

    <section id="homeView" class="view">

      <div class="hero">

        <div class="heroContent">

          <div class="badge">
            💰 Earn by completing tasks
          </div>

          <h1>
            Complete Tasks.
            <span>Earn Rewards.</span>
          </h1>

          <p class="heroText">
            Welcome to TaskEarn. Complete simple tasks,
            earn rewards and track your progress from
            one simple dashboard.
          </p>

          <div class="heroButtons">

            <button
              class="btn btn-primary btn-large"
              onclick="showAuth('register')"
            >
              Get Started
            </button>

            <button
              class="btn btn-outline btn-large"
              onclick="showAuth('login')"
            >
              Login
            </button>

          </div>


          <div class="heroStats">

            <div>
              <strong>3+</strong>
              <span>Example Tasks</span>
            </div>

            <div>
              <strong>₦450+</strong>
              <span>Example Rewards</span>
            </div>

            <div>
              <strong>24/7</strong>
              <span>Access</span>
            </div>

          </div>

        </div>


        <div class="earnCard">

          <div class="earnIcon">
            💰
          </div>

          <p class="smallText">
            Example earnings
          </p>

          <h2>
            ₦450
          </h2>

          <p>
            Complete 3 simple tasks and track
